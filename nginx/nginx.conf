worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    upstream frontend_app {
        server frontend:3000;
    }

    upstream auth_app {
        server servicio-autenticacion:5001;
    }

    upstream access_app {
        server servicio-acceso:5002;
    }

    upstream management_app {
        server servicio-gestion:5003;
    }

    upstream reports_app {
        server servicio-reportes:5004;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:TLSCache:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 10m;

        location /auth/ {
            proxy_pass http://auth_app;
        }

        location /management/ {
            proxy_pass http://management_app;
        }

        location /reports/ {
            proxy_pass http://reports_app;
        }

        location /access/events/stream {
            proxy_pass http://access_app;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header Cache-Control no-cache;
            add_header X-Accel-Buffering no;
        }

        location /access/ {
            proxy_pass http://access_app;
        }

        location / {
            proxy_pass http://frontend_app;
        }
    }
}

# This listener is only reachable on host loopback behind the TLS proxy.
server {
    listen 8080;
    server_name _;
    client_max_body_size 12m;
    proxy_read_timeout 180s;

    location = /rfid {
        return 308 /rfid/;
    }
    location /rfid/ {
        proxy_pass http://pagina-control:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /voice/ {
        proxy_pass http://talentosito:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}


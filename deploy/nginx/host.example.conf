# Adapt to the EXISTING TLS proxy; do not bind ports already owned by another service.
# Replace api-qa.example.org and certificate paths. nginx -t before reloading.
server {
    listen 443 ssl;
    server_name api-qa.example.org;
    ssl_certificate /etc/letsencrypt/live/api-qa.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-qa.example.org/privkey.pem;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:9083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
}


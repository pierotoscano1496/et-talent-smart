# Adapt to the EXISTING TLS proxy; do not bind ports already owned by another service.
# Referencia final: requiere certificado existente. Primer arranque: host-http.example.conf.
server {
    listen 80;
    server_name api-talentsmart-qa.vexaperu.com;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name api-talentsmart-qa.vexaperu.com;
    ssl_certificate /etc/letsencrypt/live/api-talentsmart-qa.vexaperu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-talentsmart-qa.vexaperu.com/privkey.pem;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:9083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
}


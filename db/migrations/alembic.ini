# =============================================================================
# db/migrations/alembic.ini
# Configuración de Alembic para el sistema IoT de Control de Acceso RFID
# La URL de base de datos se lee desde la variable de entorno DATABASE_URL
# =============================================================================

[alembic]
# Ruta al directorio que contiene los scripts de migración
script_location = %(here)s

# Plantilla de nombre para nuevas revisiones
file_template = %%(rev)s_%%(slug)s

# Codificación del sistema de archivos
prepend_sys_path = .

# La URL de la base de datos se inyecta desde env.py usando la variable DATABASE_URL
# No se define sqlalchemy.url aquí para evitar credenciales en texto claro
# sqlalchemy.url se configura en env.py

# Nivel de log de Alembic
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
